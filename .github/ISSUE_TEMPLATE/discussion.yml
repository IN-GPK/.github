name: 💬 Discussão
description: Inicie uma conversa, peça opiniões ou levante um tópico.
title: '[DISCUSSÃO] Breve tópico para debate'
labels:
  - discussão
  - planejamento
assignees: []

body:
  - type: textarea
    id: topico
    attributes:
      label: Tópico da Discussão
      description: Qual é o assunto principal que você quer discutir ou levantar?
      placeholder: >
        Ex. Melhor abordagem para implementar a internacionalização da aplicação.
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Contexto e Motivação
      description: Explique por que este tópico é importante agora. Qual problema ele busca resolver ou qual oportunidade ele visa aproveitar?
      placeholder: >
        Ex. Com o aumento do número de usuários em diferentes regiões, a necessidade de suportar múltiplos idiomas se tornou crucial para a experiência do usuário.
    validations:
      required: true

  - type: textarea
    id: pontos
    attributes:
      label: Pontos para Debate
      description: Liste as questões ou pontos específicos sobre os quais você gostaria de obter feedback ou opiniões.
      placeholder: |
        * Qual framework/biblioteca de internacionalização devemos usar?
        * Como devemos estruturar os arquivos?
        * Quem será responsável inicial?
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas Consideradas (Opcional)
      description: Se você já pensou em diferentes abordagens, descreva-as brevemente aqui para direcionar a discussão.
      placeholder: >
        Ex. Consideramos soluções prontas como i18n-next, mas também avaliamos uma solução interna mais simples.
    validations:
      required: false

  - type: textarea
    id: recursos
    attributes:
      label: Recursos Adicionais (Opcional)
      description: Links para artigos, documentações ou exemplos que possam ajudar na discussão.
      placeholder: >
        Ex. [Link para artigo sobre i18n]
    validations:
      required: false
