name: ✅ Conclusão de Tarefa/Funcionalidade
description: Use para marcar a conclusão de uma tarefa ou funcionalidade.
title: '[CONCLUÍDO] Breve descrição da tarefa/funcionalidade concluída'
labels:
  - concluído
  - milestone
assignees: []

body:
  - type: textarea
    id: tarefa_concluida
    attributes:
      label: Tarefa/Funcionalidade Concluída
      description: Qual tarefa ou funcionalidade foi concluída?
      placeholder: >
        Ex: Implementação do sistema de login com autenticação de dois fatores.
    validations:
      required: true

  - type: textarea
    id: resumo_acoes
    attributes:
      label: Resumo das Ações
      description: Descreva as principais ações realizadas para concluir esta tarefa/funcionalidade.
      placeholder: >
        Ex:
        - Implementado o formulário de login.
        - Adicionada a lógica de autenticação de dois fatores.
        - Criados testes unitários e de integração.
        - Atualizada a documentação.
    validations:
      required: true

  - type: textarea
    id: resultados
    attributes:
      label: Resultados/Evidências
      description: Quais são os resultados ou evidências de que a tarefa/funcionalidade foi concluída com sucesso?
      placeholder: >
        Ex:
        - O sistema de login funciona corretamente com autenticação de dois fatores.
        - Todos os testes passaram.
        - A documentação foi atualizada.
    validations:
      required: true

  - type: textarea
    id: proximos_passos
    attributes:
      label: Próximos Passos (Opcional)
      description: Se houver próximos passos ou tarefas relacionadas, liste-os aqui.
      placeholder: >
        Ex:
        - Implantar a nova versão em produção.
        - Monitorar o sistema de login nos próximos dias.
    validations:
      required: false

  - type: textarea
    id: notas_adicionais
    attributes:
      label: Notas Adicionais (Opcional)
      description: Qualquer informação adicional relevante.
      placeholder: >
        Ex: Informações sobre pendências, alertas de segurança, etc.
    validations:
      required: false
